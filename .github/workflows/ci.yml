name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Typecheck (public types)
        run: npm run test:types

      - name: Bundle size guard
        run: |
          SIZE=$(stat -c%s dist/idle-until.min.js)
          LIMIT=4096
          echo "dist/idle-until.min.js = ${SIZE} bytes (limit ${LIMIT})"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::Bundle exceeds ${LIMIT} bytes"
            exit 1
          fi
