name: Publish

# Publishes to npm via OIDC Trusted Publishing — no NPM_TOKEN secret needed.
#
# One-time setup on npmjs.com (only the package owner can do this):
#   Package "idle-until" -> Settings -> Trusted Publisher -> GitHub Actions:
#     User/Org:           xShiroeNguyenx
#     Repository:         idle-until
#     Workflow filename:  publish.yml      (EXACTLY this, not the full path)
#     Environment:        (leave blank)
#
# Note: we intentionally do NOT use setup-node's `registry-url`. That option
# writes an .npmrc with `_authToken=${NODE_AUTH_TOKEN}`; with no token that
# becomes an empty credential and npm publishes ANONYMOUSLY (-> 404) instead
# of using OIDC. Omitting it lets npm authenticate via the OIDC token.
#
# Rollback if OIDC still fails: `git revert` this commit to the token version
# (the NPM_TOKEN secret is still present and the package still allows it).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Trusted Publishing requires npm >= 11.5.1; Node 20 ships npm 10.x.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Versions
        run: node -v && npm -v

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # No NODE_AUTH_TOKEN and no registry-url: npm authenticates via OIDC
      # because a Trusted Publisher is configured for this repo/workflow.
      - name: Publish to npm
        run: npm publish --provenance --access public
