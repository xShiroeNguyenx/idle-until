name: Publish

# Publishes to npm via OIDC Trusted Publishing — no NPM_TOKEN secret needed.
#
# One-time setup on npmjs.com (only the package owner can do this):
#   Package "idle-until" -> Settings -> Trusted Publisher -> GitHub Actions:
#     User/Org:           xShiroeNguyenx
#     Repository:         idle-until
#     Workflow filename:  publish.yml
#     Environment:        (leave blank)
#
# Notes:
#   - The first Trusted-Publishing release must be a NEW version (you cannot
#     republish an existing one). Bump "version" before creating the Release.
#   - This workflow no longer reads NPM_TOKEN. The next release is the first
#     LIVE test of OIDC — it only works once the Trusted Publisher is configured
#     on npmjs with the repo + this exact workflow filename. If that publish
#     fails, the rollback is `git revert` of this workflow commit (back to the
#     token-based version), not the secret. Delete the NPM_TOKEN secret only
#     after a successful OIDC publish.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing requires npm >= 11.5.1; Node 20 ships npm 10.x.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # No NODE_AUTH_TOKEN: npm authenticates via OIDC because a Trusted
      # Publisher is configured for this repo/workflow. Provenance is emitted
      # automatically by Trusted Publishing.
      - name: Publish to npm
        run: npm publish --provenance --access public
